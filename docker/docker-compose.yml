version: '3.8'

services:
  k8s-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: k8s-resource-api:1.2
    container_name: k8s-resource-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      # 设置 NODE_IP 环境变量，请根据实际情况修改
      - NODE_IP=${NODE_IP:-192.168.248.51}
      - SWAGGER_HOST=127.0.0.1:8080
    volumes:
      # 日志目录（可选）
      - ./logs:/app/logs
      # 管理员kubeconfig文件挂载（可选）
      - ./config.yaml:/app/config/admin-kubeconfig:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
