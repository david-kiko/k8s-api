basePath: /api/v1/k8s
definitions:
  main.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  main.CreateEnvironmentRequest:
    properties:
      image:
        example: registry.km.top/kmai/ubuntu:22.04-ide
        type: string
      kmcode_config:
        additionalProperties: true
        type: object
      kubeconfig:
        example: |-
          apiVersion: v1
          kind: Config
          ...
        type: string
      name:
        example: demo
        type: string
      namespace:
        example: dev-space
        type: string
      nodeports:
        properties:
          opencode:
            example: 0
            type: integer
          ssh:
            example: 0
            type: integer
          terminal:
            example: 0
            type: integer
          vscode:
            example: 0
            type: integer
        type: object
      resources:
        properties:
          cpu:
            example: 1000m
            type: string
          cpu_limit:
            example: 2000m
            type: string
          memory:
            example: 2Gi
            type: string
          memory_limit:
            example: 4Gi
            type: string
        required:
        - cpu
        - cpu_limit
        - memory
        - memory_limit
        type: object
      storage:
        properties:
          workspace:
            example: 10Gi
            type: string
        type: object
    required:
    - image
    - kubeconfig
    - name
    - resources
    type: object
  main.DeleteEnvironmentRequest:
    properties:
      delete_storage:
        example: false
        type: boolean
      kubeconfig:
        example: |-
          apiVersion: v1
          kind: Config
          ...
        type: string
      namespace:
        example: dev-space
        type: string
    required:
    - kubeconfig
    - namespace
    type: object
  main.DeletePVCRequest:
    properties:
      kubeconfig:
        example: |-
          apiVersion: v1
          kind: Config
          ...
        type: string
      namespace:
        example: dev-space
        type: string
    required:
    - kubeconfig
    - namespace
    type: object
  main.DeleteServiceAccountRequest:
    properties:
      kubeconfig:
        example: |-
          apiVersion: v1
          kind: Config
          ...
        type: string
      namespace:
        example: dev-space
        type: string
    required:
    - namespace
    type: object
  main.GetEnvironmentRequest:
    properties:
      kubeconfig:
        example: |-
          apiVersion: v1
          kind: Config
          ...
        type: string
      namespace:
        example: dev-space
        type: string
    required:
    - kubeconfig
    - namespace
    type: object
  main.KubeconfigRequest:
    properties:
      create_if_not_exists:
        example: true
        type: boolean
      kubeconfig:
        example: |-
          apiVersion: v1
          kind: Config
          ...
        type: string
      namespace:
        example: default
        type: string
      resource_limits:
        properties:
          cpu:
            example: "8"
            type: string
          memory:
            example: 16Gi
            type: string
          pod_count:
            example: "2"
            type: string
          storage:
            example: 20Gi
            type: string
        type: object
      token_expiration_hours:
        example: 1
        type: integer
    type: object
  main.ListEnvironmentsRequest:
    properties:
      kubeconfig:
        example: |-
          apiVersion: v1
          kind: Config
          ...
        type: string
      namespace:
        description: 可选，不指定则用kubeconfig中的
        example: dev-space
        type: string
      page:
        default: 1
        description: 页码，从1开始
        example: 1
        type: integer
      page_size:
        default: 20
        description: 每页大小
        example: 20
        type: integer
    required:
    - kubeconfig
    type: object
  main.ListPVCsRequest:
    properties:
      filter:
        example: demo
        type: string
      kubeconfig:
        example: |-
          apiVersion: v1
          kind: Config
          ...
        type: string
      namespace:
        example: dev-space
        type: string
    required:
    - kubeconfig
    type: object
  main.ListServiceAccountsRequest:
    properties:
      kubeconfig:
        description: 可选，不提供则用管理员kubeconfig
        example: |-
          apiVersion: v1
          kind: Config
          ...
        type: string
      namespace:
        description: 可选，不指定则列所有命名空间
        example: dev-space
        type: string
      page:
        default: 1
        description: 页码，从1开始
        example: 1
        type: integer
      page_size:
        default: 20
        description: 每页大小
        example: 20
        type: integer
    type: object
  main.PVCInfo:
    properties:
      access_modes:
        items:
          type: string
        type: array
      age:
        type: string
      capacity:
        type: string
      name:
        type: string
      namespace:
        type: string
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Kubernetes资源管理API，支持动态创建开发环境和SA权限管理
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: K8S Resource API
  version: "1.0"
paths:
  /environments:
    post:
      consumes:
      - application/json
      description: 基于ServiceAccount的kubeconfig创建完整的K8s环境，包括PVC、Deployment和Service。使用传入的kubeconfig中的身份信息
      parameters:
      - description: 创建环境请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CreateEnvironmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/main.APIResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 创建环境
      tags:
      - environments
  /environments/{name}:
    delete:
      consumes:
      - application/json
      description: 删除指定名称的环境，包括Deployment和Service。可通过delete_storage参数控制是否删除PVC
      parameters:
      - description: 环境名称
        in: path
        name: name
        required: true
        type: string
      - description: 删除环境请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.DeleteEnvironmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/main.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 删除环境
      tags:
      - environments
    post:
      consumes:
      - application/json
      description: 获取指定名称的环境的状态信息
      parameters:
      - description: 环境名称
        in: path
        name: name
        required: true
        type: string
      - description: 获取环境信息请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GetEnvironmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/main.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 获取环境信息
      tags:
      - environments
  /environments/list:
    post:
      consumes:
      - application/json
      description: 列出用户有权限访问的所有环境，支持分页和简单的命名空间过滤
      parameters:
      - description: 列出环境请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.ListEnvironmentsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功，data中包含环境列表
          schema:
            $ref: '#/definitions/main.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      tags:
      - environments
  /pvcs/{name}:
    delete:
      consumes:
      - application/json
      description: 删除指定环境的PVC（警告：此操作不可逆，数据将永久丢失）
      parameters:
      - description: 环境名称
        in: path
        name: name
        required: true
        type: string
      - description: 删除PVC请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.DeletePVCRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/main.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 删除PVC
      tags:
      - pvcs
  /pvcs/list:
    post:
      consumes:
      - application/json
      description: 列出PVC，支持按命名空间和名称前缀过滤
      parameters:
      - description: 列出PVC请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.ListPVCsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/main.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.PVCInfo'
                  type: array
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 列出PVC
      tags:
      - pvcs
  /service-accounts/{name}:
    delete:
      consumes:
      - application/json
      description: 删除指定的ServiceAccount及其相关权限配置（Role、RoleBinding、ResourceQuota）
      parameters:
      - description: ServiceAccount名称
        in: path
        name: name
        required: true
        type: string
      - description: 删除ServiceAccount请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.DeleteServiceAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/main.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 删除ServiceAccount
      tags:
      - service-accounts
    post:
      consumes:
      - application/json
      description: 创建指定的ServiceAccount，分配权限，并返回对应的kubeconfig
      parameters:
      - description: ServiceAccount名称
        in: path
        name: name
        required: true
        type: string
      - description: 创建ServiceAccount请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.KubeconfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/main.APIResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 创建ServiceAccount并返回kubeconfig
      tags:
      - service-accounts
  /service-accounts/list:
    post:
      consumes:
      - application/json
      description: 列出用户有权限查看的ServiceAccount，支持分页和命名空间过滤
      parameters:
      - description: 列出ServiceAccount请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.ListServiceAccountsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功，data中包含ServiceAccount列表
          schema:
            $ref: '#/definitions/main.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      tags:
      - service-accounts
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
