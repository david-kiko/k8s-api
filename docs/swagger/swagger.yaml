  title: K8S Resource API
  version: "1.0"
paths:
  /environments:
    post:
      consumes:
      - application/json
      description: 基于ServiceAccount的kubeconfig创建完整的K8s环境，包括PVC、Deployment和Service。使用传入的kubeconfig中的身份信息
      parameters:
      - description: 创建环境请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.CreateEnvironmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/main.APIResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 创建环境
      tags:
      - environments
  /environments/{name}:
    delete:
      consumes:
      - application/json
      description: 删除指定名称的环境，包括PVC、Deployment和Service
      parameters:
      - description: 环境名称
        in: path
        name: name
        required: true
        type: string
      - description: 删除环境请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.DeleteEnvironmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/main.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 删除环境
      tags:
      - environments
    post:
      consumes:
      - application/json
      description: 获取指定名称的环境的状态信息
      parameters:
      - description: 环境名称
        in: path
        name: name
        required: true
        type: string
      - description: 获取环境信息请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GetEnvironmentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/main.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 获取环境信息
      tags:
      - environments
  /service-accounts/{name}:
    delete:
      consumes:
      - application/json
      description: 删除指定的ServiceAccount及其相关权限配置（Role、RoleBinding、ResourceQuota）
      parameters:
      - description: ServiceAccount名称
        in: path
        name: name
        required: true
        type: string
      - description: 删除ServiceAccount请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.DeleteServiceAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/main.APIResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 删除ServiceAccount
      tags:
      - service-accounts
    post:
      consumes:
      - application/json
      description: 创建指定的ServiceAccount，分配权限，并返回对应的kubeconfig
      parameters:
      - description: ServiceAccount名称
        in: path
        name: name
        required: true
        type: string
      - description: 创建ServiceAccount请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.KubeconfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/main.APIResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/main.APIResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/main.APIResponse'
      summary: 创建ServiceAccount并返回kubeconfig
      tags:
      - service-accounts
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
